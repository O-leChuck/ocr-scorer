# ocr-scorer configuration template
#
# Copy this file to config.ini (in the same folder) and fill in your
# own paths below. config.ini is ignored by git (see .gitignore), so
# your local paths will never be committed or pushed - config.template.ini
# is the one tracked in version control, as a starting point for anyone
# who clones this project.
#
# Both paths are optional. If a path is left empty, missing entirely,
# or points to a folder that no longer exists, the script falls back to
# searching common locations automatically, then to a built-in default -
# you'll still be prompted to pick folders manually either way, this
# just controls where the folder-selection dialog starts.

[paths]
goldstandard_folder =
prediction_folder =
